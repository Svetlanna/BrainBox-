version: '3.8'
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: brainbox-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: brainbox-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend