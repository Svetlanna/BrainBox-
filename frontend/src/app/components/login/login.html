<div class="login-page">
  <form (ngSubmit)="onSubmit()" #f="ngForm" class="login-card">
    <h2>Connexion</h2>
    <p class="subtitle">Accède à ta base de connaissances BrainBox</p>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <label>
      <span class="label-text">Email</span>
      <input type="email" name="email" [ngModel]="email()" (ngModelChange)="email.set($event)" required />
    </label>

    <label>
      <span class="label-text">Mot de passe</span>
      <input type="password" name="password" [ngModel]="password()" (ngModelChange)="password.set($event)" required />
    </label>

    <button type="submit" [disabled]="loading() || f.invalid">
      {{ loading() ? 'Connexion...' : 'Se connecter' }}
    </button>
  </form>

</div>
